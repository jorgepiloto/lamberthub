name: release

on:
  push:
    tags:
      - "v*.*.*"

env:
  DOCUMENTATION_BASE_URL: 'https://jorgemartinez.space/projects/lamberthub/version/stable/'
  DOCUMENTATION_CNAME: 'jorgemartinez.space/projects/lamberthub'
  DOCUMENTATION_ROOT_URL: 'https://jorgemartinez.space/projects/lamberthub'
  MAIN_PYTHON_VERSION: '3.12'
  LIBRARY_NAME: lamberthub

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  update-changelog:
    name: Update changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write # Commit the changelog and recreate the release tag
      pull-requests: write # Create a changelog pull request when required
    steps:
      - name: Update changelog
        uses: ansys/actions/doc-deploy-changelog@88fa7e3b0b7dbead9c6f8b38c5e742d4768965d2 # zizmor: ignore[stale-action-refs] intentional ci/zizmor-hook SHA
        with:
          token: ${{ secrets.WEBSITE_DEPLOY_KEY }} # zizmor: ignore[secrets-outside-env]
          bot-user: github-actions[bot]
          bot-email: 41898282+github-actions[bot]@users.noreply.github.com
          release-from-main: true
          use-python-cache: false

  code-style:
    name: Code style
    needs: update-changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run code style checks
        uses: ansys/actions/code-style@88fa7e3b0b7dbead9c6f8b38c5e742d4768965d2 # zizmor: ignore[stale-action-refs] intentional ci/zizmor-hook SHA
        env:
          SKIP: 'zizmor'
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          use-python-cache: false

  doc-style:
    name: Doc style
    needs: update-changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run documentation style checks
        uses: ansys/actions/doc-style@88fa7e3b0b7dbead9c6f8b38c5e742d4768965d2 # zizmor: ignore[stale-action-refs] intentional ci/zizmor-hook SHA
        with:
          files: README.md doc/source
          token: ${{ github.token }}

  doc-build:
    name: Doc build
    needs: doc-style
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: Install tox
        run: uv tool install tox

      - name: Check documentation links
        run: tox -e doc-links

      - name: Build HTML documentation
        run: tox -e doc-html

      - name: Upload HTML documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-html
          path: doc/_build/html
          if-no-files-found: error

  tests:
    name: Tests
    needs: [code-style, doc-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run tests
        uses: ansys/actions/tests-pytest@88fa7e3b0b7dbead9c6f8b38c5e742d4768965d2 # zizmor: ignore[stale-action-refs] intentional ci/zizmor-hook SHA
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          group-dependencies-name: tests

  build-library:
    name: Build library
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Build source and wheel distributions
        uses: ansys/actions/build-library@88fa7e3b0b7dbead9c6f8b38c5e742d4768965d2 # zizmor: ignore[stale-action-refs] intentional ci/zizmor-hook SHA
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  release-pypi:
    name: Release project to the public PyPI
    needs: [build-library, doc-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Authenticate to PyPI through trusted publishing
      contents: read
    steps:
      - name: Download library artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.LIBRARY_NAME }}-artifacts
          path: ${{ env.LIBRARY_NAME }}-artifacts

      - name: Upload artifacts to PyPI using trusted publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://upload.pypi.org/legacy/
          print-hash: true
          packages-dir: ${{ env.LIBRARY_NAME }}-artifacts
          skip-existing: false

  release-github:
    name: Release to GitHub
    needs: release-pypi
    runs-on: ubuntu-latest
    permissions:
      actions: read # Download workflow artifacts for the release
      contents: write # Create the GitHub release
    steps:
      - name: Publish GitHub release
        uses: ansys/actions/release-github@88fa7e3b0b7dbead9c6f8b38c5e742d4768965d2 # zizmor: ignore[stale-action-refs] intentional ci/zizmor-hook SHA
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          token: ${{ github.token }}
          additional-artifacts: ${{ env.LIBRARY_NAME }}-artifacts
          changelog-release-notes: true
          generate-release-notes: false
          only-code: true
          use-python-cache: false

  doc-deploy-stable:
    name: Deploy stable docs
    needs: release-github
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    concurrency:
      group: website-documentation
      cancel-in-progress: false
    steps:
      - name: Download documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation-html
          path: documentation-html

      - name: Read release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Prepare versioned documentation
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from urllib.parse import urlsplit
          import os
          import shutil

          shutil.copytree("documentation-html", "documentation-versioned")
          page = Path("documentation-versioned/404.html")
          root = urlsplit(os.environ["DOCUMENTATION_BASE_URL"]).path
          version = os.environ["RELEASE_VERSION"]
          version_root = f"{root.rstrip('/').rsplit('/', 1)[0]}/{version}/"
          content = page.read_text(encoding="utf-8")
          old_base = f'<base href="{root}">'
          assert old_base in content, "404 page must declare the documentation root"
          page.write_text(
              content.replace(old_base, f'<base href="{version_root}">'),
              encoding="utf-8",
          )
          PYTHON

      - name: Deploy versioned documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          external_repository: jorgepiloto/website
          publish_dir: documentation-versioned
          publish_branch: gh-pages
          destination_dir: projects/lamberthub/version/${{ env.RELEASE_VERSION }}

      - name: Deploy stable documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          external_repository: jorgepiloto/website
          publish_dir: documentation-html
          publish_branch: gh-pages
          destination_dir: projects/lamberthub/version/stable
