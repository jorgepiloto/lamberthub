name: night

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  DOCUMENTATION_BASE_URL: 'https://jorgemartinez.space/projects/lamberthub/version/dev/'
  DOCUMENTATION_CNAME: 'jorgemartinez.space/projects/lamberthub'
  DOCUMENTATION_ROOT_URL: 'https://jorgemartinez.space/projects/lamberthub'
  MAIN_PYTHON_VERSION: '3.12'
  LIBRARY_NAME: lamberthub

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  doc-build:
    name: Doc build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: Install tox
        run: uv tool install tox

      - name: Check documentation links
        run: tox -e doc-links

      - name: Build HTML documentation
        run: tox -e doc-html

      - name: Upload HTML documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-html
          path: doc/_build/html
          if-no-files-found: error

  doc-deploy-dev:
    name: Deploy development docs
    needs: doc-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: website-documentation
      cancel-in-progress: false
    steps:
      - name: Download documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-html
          path: documentation-html

      - name: Deploy documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          external_repository: jorgepiloto/website
          publish_dir: documentation-html
          publish_branch: gh-pages
          destination_dir: projects/lamberthub/version/dev

  tests:
    name: Tests / Python ${{ matrix.python-version }}
    needs: doc-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Run tests
        uses: ansys/actions/tests-pytest@88fa7e3b0b7dbead9c6f8b38c5e742d4768965d2 # zizmor: ignore[stale-action-refs] intentional ci/zizmor-hook SHA
        with:
          python-version: ${{ matrix.python-version }}
          group-dependencies-name: tests

  benchmarks:
    name: Benchmarks
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run benchmarks
        uses: ansys/actions/tests-pytest@88fa7e3b0b7dbead9c6f8b38c5e742d4768965d2 # zizmor: ignore[stale-action-refs] intentional ci/zizmor-hook SHA
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          group-dependencies-name: tests,benchmarks
          pytest-postargs: tests
          pytest-extra-args: >-
            -m benchmark
            --benchmark-only
            --benchmark-disable-gc
            --benchmark-warmup=on
            --benchmark-min-rounds=5
            --benchmark-max-time=0.2

  build-wheelhouse:
    name: Build wheelhouse / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: benchmarks
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Build wheelhouse
        uses: ansys/actions/build-wheelhouse@88fa7e3b0b7dbead9c6f8b38c5e742d4768965d2 # zizmor: ignore[stale-action-refs] intentional ci/zizmor-hook SHA
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          operating-system: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}

  build-library:
    name: Build library
    needs: build-wheelhouse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Build source and wheel distributions
        uses: ansys/actions/build-library@88fa7e3b0b7dbead9c6f8b38c5e742d4768965d2 # zizmor: ignore[stale-action-refs] intentional ci/zizmor-hook SHA
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  actions-security:
    name: Check actions security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Audit GitHub Actions
        uses: ansys/actions/check-actions-security@88fa7e3b0b7dbead9c6f8b38c5e742d4768965d2 # zizmor: ignore[stale-action-refs] intentional ci/zizmor-hook SHA
        with:
          auditing-level: high
          generate-summary: true
          token: ${{ github.token }}
