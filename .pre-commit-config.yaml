repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e  # frozen: v0.17.0
  hooks:
    - id: ruff-check
    - id: ruff-format

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-merge-conflict
  - id: check-yaml
  - id: requirements-txt-fixer
  - id: trailing-whitespace
  - id: debug-statements

# Validate our github workflow files
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 4f85d46a92dc17713078e5de73f8a13190edf6fc  # frozen: 0.38.2
  hooks:
    - id: check-github-workflows

- repo: https://github.com/econchick/interrogate
  rev: a6268877efd41a21197445cc04cbf28f9c6facba  # frozen: 1.7.0
  hooks:
    - id: interrogate
      args: [src]
      pass_filenames: false

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
  hooks:
    - id: zizmor
      args: ["--pedantic"]
