[tox]
description = Default tox environments list
envlist =
    style
    test3{12,13,14}
    test312-cov
    benchmark
    doc-style-{linux,windows}
    doc-{links,html,pdf}
skip_missing_interpreters = true
isolated_build = true
isolated_build_env = build

[testenv]
description = Checks for project unit tests and coverage (if desired)
basepython =
    {style,doc}: python3
    test312: python3.12
    test313: python3.13
    test314: python3.14
passenv =
    NUMBA_DISABLE_JIT
setenv =
    PYTHONUNBUFFERED = yes
    cov: PYTEST_EXTRA_ARGS = --cov=lamberthub --cov-report=term --cov-report=xml:.cov/xml/coverage.xml --cov-report=html:.cov/html
dependency_groups = tests
commands =
    pytest {env:PYTEST_EXTRA_ARGS:} {posargs:tests -vv}

[testenv:benchmark]
description = Runs solver performance benchmarks
basepython = python3.12
dependency_groups =
    tests
    benchmarks
setenv =
    PYTHONUNBUFFERED = yes
commands_pre =
    python -c "from pathlib import Path; Path('.benchmarks').mkdir(exist_ok=True)"
commands =
    pytest tests -m benchmark --benchmark-only --benchmark-disable-gc --benchmark-warmup=on --benchmark-min-rounds=5 --benchmark-max-time=0.2 {posargs}

[testenv:style]
description = Checks project code style
skip_install = true
deps =
    pre-commit
commands =
    pre-commit install
    pre-commit run --all-files --show-diff-on-failure

[testenv:doc-style-{linux,windows}]
description = Checks project documentation style
skip_install = true
dependency_groups =
    docstyle
allowlist_externals =
    find
    vale
    bash
    cmd
platform =
    linux: linux
    windows: win32
commands =
    linux: bash -c 'rst_files=$(find {toxinidir}/doc/source -type f -name "*.rst" ! -path "*/doc/source/api-reference/*") && vale sync --config="{toxinidir}/doc/.vale.ini" && vale --config="{toxinidir}/doc/.vale.ini" $rst_files'
    windows: cmd /c "dir /s /b {toxinidir}\doc\source\*.rst | findstr /v /i \doc\source\api-reference\ > tmp_files.txt"
    windows: cmd /c "vale sync --config="{toxinidir}\doc\.vale.ini""
    windows: cmd /v:on /c "set vale_files="" && (for /f %i in (tmp_files.txt) do @set vale_files="%i" !vale_files!) && @del tmp_files.txt && vale --config="{toxinidir}\doc\.vale.ini" !vale_files!"

[testenv:doc-{clean,links,html,pdf,serve,snippets}]
description =
    clean: Clean rendered documentation
    links: Check documentation links
    html: Build HTML documentation
    pdf: Build PDF documentation
    serve: Serve HTML documentation
    snippets: Check documentation snippets
skip_install =
    clean, serve: true
allowlist_externals =
    pdflatex
setenv =
    SOURCE_DIR = doc/source
    BUILD_DIR = doc/_build
    links: BUILDER = linkcheck
    html: BUILDER = html
    pdf: BUILDER = latex
    snippets: BUILDER = doctest
    links,html,pdf,snippets: BUILDER_OPTS = --color -v -j auto -W --keep-going
passenv =
    DOCUMENTATION_BASE_URL
    DOCUMENTATION_CNAME
    DOCUMENTATION_ROOT_URL
dependency_groups =
    links,html,pdf,snippets: doc
commands =
    clean: python -c "import shutil, sys; shutil.rmtree(sys.argv[1], ignore_errors=True)" "{toxinidir}/{env:BUILD_DIR}"
    links,html,pdf,snippets: sphinx-build -d "{toxworkdir}/doc_doctree" {env:SOURCE_DIR} "{toxinidir}/{env:BUILD_DIR}/{env:BUILDER}" {env:BUILDER_OPTS} -b {env:BUILDER}
    pdf: pdflatex -interaction=nonstopmode -output-directory="{toxinidir}/{env:BUILD_DIR}/{env:BUILDER}" "{toxinidir}/{env:BUILD_DIR}/{env:BUILDER}/lamberthub.tex"
    serve: python -m http.server --directory "{toxinidir}/{env:BUILD_DIR}/html"
